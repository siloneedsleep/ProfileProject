<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0c0f14" />
<title>@siloneedsleep — Trang cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0c0f14;
    --card: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #f2f5f9;
    --muted: #8b95a5;
    --accent: #4fd1c5;
    --field: rgba(255, 255, 255, 0.05);
    --radius: 2rem;
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(60rem 40rem at 50% -10%, rgba(79, 209, 197, 0.13), transparent 70%),
      radial-gradient(45rem 35rem at 90% 110%, rgba(99, 132, 255, 0.10), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 500px;
    padding: 2.5rem 1.75rem 1.75rem;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    text-align: center;
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 0 0 6px rgba(79, 209, 197, 0.07), 0 0 28px rgba(79, 209, 197, 0.22);
    display: block;
    margin: 0 auto 1.1rem;
  }

  .handle {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .name {
    margin: 0.3rem 0 0.75rem;
    font-size: 1.85rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 0.95rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--card-border);
  }

  .bio {
    margin: 1.35rem 0 0;
    padding: 1rem 1.15rem;
    border-radius: 1.1rem;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 0.94rem;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: left;
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
    margin-top: 1.5rem;
  }

  .socials a {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.07);
    transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .socials a:hover,
  .socials a:focus-visible {
    transform: translateY(-4px);
    color: var(--text);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
    outline: none;
  }

  .socials svg { width: 19px; height: 19px; }

  .divider {
    height: 1px;
    margin: 1.6rem 0 1.1rem;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
  }

  .btn {
    font: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.7rem 1.2rem;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    transition: color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }

  .btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
  .btn svg { width: 15px; height: 15px; }

  .btn-primary {
    color: #06231f;
    background: var(--accent);
    border-color: transparent;
    font-weight: 600;
  }
  .btn-primary:hover { color: #06231f; background: #6ee0d6; }

  .form { display: none; margin-top: 1.3rem; text-align: left; }
  .form.open { display: block; }

  .field { margin-bottom: 0.9rem; }

  .field label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .field input,
  .field textarea {
    width: 100%;
    padding: 0.7rem 0.85rem;
    font: inherit;
    font-size: 0.88rem;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--card-border);
    border-radius: 0.85rem;
    resize: vertical;
  }

  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: rgba(79, 209, 197, 0.55);
    box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.12);
  }

  .hint { margin: 0.35rem 0 0; font-size: 0.72rem; color: var(--muted); }

  .actions { display: flex; gap: 0.6rem; margin-top: 1.1rem; }
  .actions .btn { flex: 1; }

  footer { margin-top: 1.4rem; font-size: 0.72rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <img id="avatar" class="avatar" src="https://i.pravatar.cc/220?img=47" alt="Ảnh đại diện của Minh Anh" />

    <p class="handle">@siloneedsleep</p>
    <h1 id="name" class="name">Minh Anh</h1>
    <span id="role" class="badge">✧ Designer ✧</span>

    <p id="bio" class="bio">Yêu thích sự tối giản, cà phê và những bản nhạc chiều. ✨</p>

    <nav id="socials" class="socials" aria-label="Liên kết mạng xã hội"></nav>

    <div class="divider" role="presentation"></div>

    <button id="toggleBtn" class="btn" type="button" aria-expanded="false" aria-controls="editForm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      Chỉnh sửa trang cá nhân
    </button>

    <form id="editForm" class="form">
      <div class="field">
        <label for="f-name">Tên hiển thị</label>
        <input id="f-name" type="text" placeholder="Minh Anh" />
      </div>
      <div class="field">
        <label for="f-role">Vai trò / Tagline</label>
        <input id="f-role" type="text" placeholder="✧ Designer ✧" />
      </div>
      <div class="field">
        <label for="f-bio">Giới thiệu</label>
        <textarea id="f-bio" rows="3" placeholder="Vài dòng về bạn..."></textarea>
      </div>
      <div class="field">
        <label for="f-avatar">Đường dẫn ảnh đại diện</label>
        <input id="f-avatar" type="url" placeholder="https://i.pravatar.cc/220?img=47" />
      </div>
      <div class="field">
        <label for="f-links">Liên kết mạng xã hội (mỗi dòng một liên kết)</label>
        <textarea id="f-links" rows="5" placeholder="https://github.com/silo&#10;mailto:xin.chao@email.com"></textarea>
        <p class="hint">Hỗ trợ GitHub, Facebook, Instagram, Twitter/X, Discord, TikTok, Email (mailto:) và liên kết thường.</p>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <button type="button" id="cancelBtn" class="btn">Huỷ</button>
      </div>
    </form>

    <footer>Được làm với ♡ — chỉ hiển thị tạm thời, không lưu trên máy chủ.</footer>
  </main>

<script>
  // ----- Dữ liệu mẫu (không có backend) -----
  var profile = {
    name: "Minh Anh",
    role: "✧ Designer ✧",
    bio: "Yêu thích sự tối giản, cà phê và những bản nhạc chiều. ✨",
    avatar: "https://i.pravatar.cc/220?img=47",
    links: [
      "https://github.com/siloneedsleep",
      "https://facebook.com/siloneedsleep",
      "https://instagram.com/siloneedsleep",
      "https://x.com/siloneedsleep",
      "https://discord.com/users/siloneedsleep",
      "https://tiktok.com/@siloneedsleep",
      "mailto:xin.chao@email.com",
      "https://siloneedsleep.dev"
    ]
  };

  // ----- Bộ icon SVG -----
  var ICONS = {
    github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7A5.2 5.2 0 0 0 19 4.8 4.8 4.8 0 0 0 18.9 1S17.6.6 15 2.4a12.3 12.3 0 0 0-6.6 0C5.8.6 4.5 1 4.5 1A4.8 4.8 0 0 0 4.4 4.8 5.2 5.2 0 0 0 3 8.5c0 5.2 3.2 6.4 6.2 6.7a3.4 3.4 0 0 0-.9 2.6V22"/>',
    facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    instagram: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/>',
    twitter: '<path d="M4 3l7.2 9.6L4.4 21h2.4l5.5-6.6L17 21h3l-7.4-9.9L19.4 3H17l-5.1 6.1L8 3z" fill="currentColor" stroke="none"/>',
    discord: '<path d="M9 12a1 1 0 1 0 0-.01M15 12a1 1 0 1 0 0-.01"/><path d="M8.5 5.5A12 12 0 0 1 12 5a12 12 0 0 1 3.5.5L17 4s3 1 4 4c1 3 1 7 0 10-2 1.5-4 2-4 2l-1-2m-8 0-1 2s-2-.5-4-2c-1-3-1-7 0-10 1-3 4-4 4-4z"/>',
    tiktok: '<path d="M14 3v10.5a3.5 3.5 0 1 1-3.5-3.5c.4 0 .7 0 1 .1"/><path d="M14 3c.5 2.8 2.4 4.5 5 4.7"/>',
    email: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2.5 6 9.5 7 9.5-7"/>',
    link: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
  };

  var LABELS = {
    github: "GitHub", facebook: "Facebook", instagram: "Instagram",
    twitter: "Twitter / X", discord: "Discord", tiktok: "TikTok",
    email: "Email", link: "Liên kết"
  };

  function detectType(url) {
    var u = url.toLowerCase();
    if (u.indexOf("mailto:") === 0 || u.indexOf("@") > -1 && u.indexOf("http") !== 0) return "email";
    if (u.indexOf("github.com") > -1) return "github";
    if (u.indexOf("facebook.com") > -1 || u.indexOf("fb.com") > -1) return "facebook";
    if (u.indexOf("instagram.com") > -1) return "instagram";
    if (u.indexOf("twitter.com") > -1 || u.indexOf("x.com") > -1) return "twitter";
    if (u.indexOf("discord") > -1) return "discord";
    if (u.indexOf("tiktok.com") > -1) return "tiktok";
    return "link";
  }

  function normalize(url) {
    var u = url.trim();
    if (!u) return "";
    if (u.indexOf("mailto:") === 0 || /^https?:\/\//i.test(u)) return u;
    if (u.indexOf("@") > -1 && u.indexOf(".") > -1) return "mailto:" + u;
    return "https://" + u;
  }

  function render() {
    document.getElementById("name").textContent = profile.name;
    document.getElementById("role").textContent = profile.role;
    document.getElementById("bio").textContent = profile.bio;
    var img = document.getElementById("avatar");
    img.src = profile.avatar;
    img.alt = "Ảnh đại diện của " + profile.name;

    var nav = document.getElementById("socials");
    nav.innerHTML = "";
    profile.links.forEach(function (raw) {
      var href = normalize(raw);
      if (!href) return;
      var type = detectType(href);
      var a = document.createElement("a");
      a.href = href;
      a.title = LABELS[type];
      a.setAttribute("aria-label", LABELS[type]);
      if (type !== "email") { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      a.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[type] + "</svg>";
      nav.appendChild(a);
    });
  }

  // ----- Biểu mẫu chỉnh sửa -----
  var form = document.getElementById("editForm");
  var toggleBtn = document.getElementById("toggleBtn");

  function fillForm() {
    document.getElementById("f-name").value = profile.name;
    document.getElementById("f-role").value = profile.role;
    document.getElementById("f-bio").value = profile.bio;
    document.getElementById("f-avatar").value = profile.avatar;
    document.getElementById("f-links").value = profile.links.join("\n");
  }

  function closeForm() {
    form.classList.remove("open");
    toggleBtn.setAttribute("aria-expanded", "false");
  }

  toggleBtn.addEventListener("click", function () {
    var isOpen = form.classList.toggle("open");
    toggleBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    if (isOpen) { fillForm(); document.getElementById("f-name").focus(); }
  });

  document.getElementById("cancelBtn").addEventListener("click", closeForm);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    profile.name = document.getElementById("f-name").value.trim() || profile.name;
    profile.role = document.getElementById("f-role").value.trim() || profile.role;
    profile.bio = document.getElementById("f-bio").value;
    profile.avatar = document.getElementById("f-avatar").value.trim() || profile.avatar;
    profile.links = document.getElementById("f-links").value
      .split("\n")
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
    render();
    closeForm();
  });

  render();
</script>
</body>
</html>
